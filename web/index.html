<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISS-TMUX</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Grid Mode -->
  <div id="grid-view">
    <div id="grid-container"></div>
  </div>

  <!-- Focus Mode -->
  <div id="focus-view" class="hidden">
    <div id="sidebar"></div>
    <div id="focus-terminal"></div>
  </div>

  <!-- New Session Dialog -->
  <div id="dialog-overlay" class="hidden">
    <div id="new-session-dialog">
      <h3>New Session</h3>
      <label>Name <input type="text" id="dialog-name" placeholder="optional"></label>
      <label>Working Directory
        <div class="cwd-row">
          <input type="text" id="dialog-cwd" placeholder="current directory">
          <button type="button" id="dialog-browse" title="Browse...">&#128193;</button>
        </div>
      </label>

      <!-- Directory Browser Panel -->
      <div id="dir-browser" class="hidden">
        <div class="dir-browser-header">
          <span id="dir-browser-path"></span>
          <button type="button" id="dir-browser-up" title="Parent directory">&#8593;</button>
        </div>
        <div id="dir-browser-list"></div>
        <div class="dir-browser-buttons">
          <button type="button" id="dir-browser-cancel">Cancel</button>
          <button type="button" id="dir-browser-select">Select</button>
        </div>
      </div>
      <label>Command <input type="text" id="dialog-cmd" value="claude --dangerously-skip-permissions"></label>
      <div class="dialog-buttons">
        <button id="dialog-cancel">Cancel</button>
        <button id="dialog-create">Create</button>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="hidden">
    <div class="menu-item" data-action="rename">Rename</div>
    <div class="menu-item" data-action="kill">Kill</div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/xterm-addon-webgl.js"></script>
  <script src="app.js"></script>
</body>
</html>
